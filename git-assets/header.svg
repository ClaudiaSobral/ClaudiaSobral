<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="fire" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="0" y2="320">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="14%" stop-color="#fff6b0"/>
      <stop offset="26%" stop-color="#ffe066"/>
      <stop offset="38%" stop-color="#ffb347"/>
      <stop offset="50%" stop-color="#ff7a3d"/>
      <stop offset="62%" stop-color="#ff4d2e"/>
      <stop offset="76%" stop-color="#b81f12"/>
      <stop offset="90%" stop-color="#4a0d06"/>
      <stop offset="100%" stop-color="#0B0B0C"/>
    </linearGradient>

    <!-- grade de linhas de 1px a cada 42px -->
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <rect width="42" height="1" fill="#fff"/>
      <rect width="1" height="42" fill="#fff"/>
      <!-- desliza exatamente 1 célula (42px) na diagonal: loop sem emenda -->
      <animateTransform attributeName="patternTransform" type="translate"
                        from="0 0" to="42 42" dur="3s" repeatCount="indefinite"/>
    </pattern>

    <mask id="gridMask">
      <rect width="1280" height="320" fill="url(#grid)"/>
    </mask>
  </defs>

  <rect width="1280" height="320" fill="#0B0B0C"/>
  <rect width="1280" height="320" fill="url(#fire)" mask="url(#gridMask)"/>
</svg>
